# aspects_sombres_hybrid.yaml
modele: "low_fantasy_grim"
description: "La réalité crue de Velkarum - Criminalité, Vices et Désespoir"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["crime", "torture", "trafic_humain", "drogues_sales", "peste", "corruption_totale"]
  mots_cles: ["coupe-jarrets", "marche_noir", "esclavage", "lames_louees", "bas-fonds"]
  description_semantique: "Il n'y a pas de 'Guilde des Voleurs' romantique. Juste des gangs brutaux, des nobles dégénérés et la survie du plus fort."

# ORGANISATIONS CRIMINELLES (GANGS ET MAFIAS)
organisations_criminelles:
  - nom: "Les Ecorcheurs"
    territoire: "Bas-fonds de Lorn"
    activite: "Racket, enlèvement, meurtres sur commande."
    methode: "Ils ne laissent pas de témoins. Connus pour mutiler leurs rivaux."
    chef: "Inconnu (probablement un noble déchu)."

  - nom: "La Fraternité du Port"
    territoire: "Lirn et côtes"
    activite: "Contrebande, piraterie, traite des esclaves."
    couverture: "Syndicat des dockers et marins."

  - nom: "Les Rats des Mines"
    territoire: "Thaurgrim"
    activite: "Vol de minerai précieux, trafic d'alcool de contrebande dans les camps de travail."

# TRAFICS ILLICITES
trafic_etres:
  - type: "Main d'œuvre forcée"
    clients: "Mines de Thaurgrim, Galères d'Iskarion."
    victimes: "Orphelins des rues, paysans endettés, prisonniers de guerre."
    prix: "Moins cher qu'un cheval."

  - type: "Servitude domestique"
    clients: "Bourgeoisie d'Eldaron et Ardel."
    nature: "Souvent déguisé en 'contrat d'apprentissage' à vie."

stupefiants:
  - nom: "Lait de Pavot Noir"
    effet: "Anti-douleur puissant, rend léthargique et dépendant en quelques jours."
    consommateurs: "Soldats blessés, pauvres cherchant l'oubli."

  - nom: "Poussière de Rhaal"
    effet: "Hallucinogène violent, provoque des crises de rage."
    origine: "Champignons parasites de la jungle."
    consommateurs: "Berserkers, cultistes."

  - nom: "Cendre Rouge"
    effet: "Stimulant respiratoire (temporaire), puis nécrose des poumons."
    consommateurs: "Mineurs de Thaurgrim (pour travailler plus longtemps)."

# EXPLOITATIONS CLANDESTINES
activites:
  - "Fosses de combat illégales (animaux vs humains, ou humains vs humains à mort)."
  - "Ateliers de fausse monnaie (punissable d'être bouilli vivant)."
  - "Médecine de l'ombre (chirurgie sans hygiène, avortements dangereux, poisons)."

# CORRUPTION
systemique:
  - "Les Gardes de ville : Ne patrouillent que si payés par les commerçants."
  - "Les Juges : Les sentences sont à vendre. Un noble ne sera jamais pendu, un paysan le sera pour un vol de pomme."
  - "L'Église : Vend des indulgences et absout les péchés des riches donateurs."

# GROUPES DE MERCENAIRES (LES CHIENS DE GUERRE)
mercenaires:
  - nom: "La Compagnie Noire"
    réputation: "Disciplinés mais sans pitié. Brûlent les villages qui ne paient pas."
    tarif: "Très élevé. Paiement en or uniquement."

  - nom: "Les Bâtards de Valnoria"
    réputation: "Déséteurs et criminels. Utiles pour le sale boulot, imprévisibles."

# JUSTICE (BRUTALE ET EXPÉDITIVE)
peines_courantes:
  - "Vol : Ablation d'une main ou marquage au fer rouge."
  - "Meurtre (roturier) : Pendaison ou Roue."
  - "Hérésie/Sorcellerie : Bûcher."
  - "Dettes : Prison à vie ou esclavage."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 1.0_dark
  type_contenu: "criminalite_realiste"