# economie.yaml
modele: "low_fantasy_grim"
description: "Système économique de Velkarum - Basé sur la pénurie, le métal et le contrôle des ressources"

# SECTION OPTIMISÉE POUR L'EMBEDDING SEMANTIQUE
embedding_optimized:
  themes: ["économie_médiévale", "pénurie", "monnaie_physique", "troc", "taxes_lourdes", "routes_dangereuses"]
  mots_cles: ["couronne_fer", "sel_gemme", "cendre_fertilisante", "bois_dur", "famine", "usure", "guildes_mafieuses"]
  description_semantique: "Économie de subsistance et de guerre. Les monnaies sont souvent rognées ou dévaluées. Le commerce est vital mais mortellement dangereux."

# SYSTÈME MONÉTAIRE (MÉTALLIQUE ET INSTABLE)
systeme_monetaire:
  monnaie_principale:
    nom: "Couronne de Fer"
    symbole: "♔"
    origine: "Royaume de Valnoria (45,55)"
    statut: "Monnaie imposée par la force militaire"
    subdivisions: ["Liotard (Argent, 1/20)", "Sol (Cuivre, 1/100)", "Clou (Fer brut, monnaie du peuple)"]
    problemes_courants: ["Rognage des pièces", "Alliages de mauvaise qualité", "Refusée dans les zones tribales"]
    materiau: "Fer noirci (Eldaron) ou Argent terni"

  monnaies_regionales:
    - nom: "Tola Solaire"
      region: "Iskarion"
      valeur: "Variable selon le poids"
      utilisation: "Commerce des épices et du verre"
      particularite: "Disques d'or fin, souvent coupés aux ciseaux pour faire l'appoint."

    - nom: "Dent de Kraken"
      region: "Helrün"
      valeur: "Troc uniquement"
      utilisation: "Commerce de survie (graisse, peaux)"
      particularite: "Ivoire gravé. Valeur symbolique, inutile au sud."

    - nom: "Plaque de Laitier"
      region: "Thaurgrim"
      valeur: "Reconnue pour sa pureté métallique"
      utilisation: "Achats industriels, armes"
      particularite: "Lourde, carrée, difficile à transporter."

    - nom: "Graine d'Ambre"
      region: "Varnäl"
      valeur: "Élevée (Luxe)"
      utilisation: "Drogues, poisons, bois précieux"
      particularite: "Monnaie organique, se dégrade si mal conservée."

# INSTITUTIONS FINANCIÈRES (USURE ET COFFRES-FORTS)
institutions_financieres:
  - nom: "La Tour des Comptes (Lorn)"
    type: "Trésor Royal et Prison pour débiteurs"
    coordonnees: {x: 45, y: 55}
    fonction: "Stockage des impôts royaux"
    reserves: ["Or pillé", "Titres de propriété saisis", "Stocks de grain stratégiques"]
    influence: "Détient la dette de la moitié des nobles du continent."

  - nom: "La Table des Négociants (Lirn)"
    type: "Guilde marchande impitoyable"
    coordonnees: {x: 15, y: 45}
    fonction: "Assurance maritime (prix exorbitant)"
    volume_journalier: "Incertain, dépend des naufrages"
    methodes: "Les capitaines qui perdent leurs cargaisons finissent souvent esclaves pour rembourser."

  - nom: "Les Changeurs de l'Ombre (Ardel)"
    type: "Prêteurs sur gages"
    coordonnees: {x: 60, y: 35}
    fonction: "Blanchiment et prêts à taux usuraires (40%)"
    securite: "Mercenaires privés brutaux."

# RESSOURCES STRATÉGIQUES (VITALES ET CONVOITÉES)
ressources_strategiques:
  - nom: "Glace Noire"
    origine: "Helrün (25,15)"
    valeur_unitaire: "Très élevée (seule façon de conserver la viande au sud)"
    utilisation: "Conservation alimentaire (noblesse uniquement), médecine"
    production_annuelle: "Limitée par la mortalité des extracteurs"

  - nom: "Cendres Fertilisantes"
    origine: "Thaurgrim (55,50)"
    valeur_unitaire: "Moyenne (Vital pour éviter la famine)"
    utilisation: "Agriculture intensive sur les sols pauvres d'Eldaron"
    enjeu: "Eldaron dépend totalement de ces cendres pour nourrir sa population."

  - nom: "Bois de Fer (Rhaal)"
    origine: "Varnäl (35,75)"
    valeur_unitaire: "Élevée"
    utilisation: "Navires de guerre, charpentes de forteresses, piques"
    production: "Dangereuse (bûcherons souvent tués par la faune ou les locaux)"

  - nom: "Verre Solaire"
    origine: "Iskarion (35,75)"
    valeur_unitaire: "Luxe"
    utilisation: "Optique rudimentaire, fioles alchimiques, religion"

  - nom: "Sel Fossile"
    origine: "Helrün (25,15)"
    valeur_unitaire: "Stable"
    utilisation: "Salaison (survie de l'hiver), tannage"

# FLUX COMMERCIAUX (DANGEREUX ET NÉCESSAIRES)
flux_commerciaux_intercontinentaux:
  - nom: "La Route de la Faim"
    participants: ["Eldaron", "Thaurgrim"]
    flux: "Grain (Eldaron) ↔ Cendres (Thaurgrim)"
    tension: "Si Thaurgrim ne livre pas, Eldaron meurt de faim. Si Eldaron ne livre pas, Thaurgrim meurt de faim."
    routes: ["Route des Cendres (infestée de bandits)"]

  - nom: "Le Triangle du Fer et du Bois"
    participants: ["Iskarion", "Thaurgrim", "Varnäl"]
    flux: "Minerai brut ↔ Bois de construction ↔ Esclaves"
    valeur: "Fondamental pour l'effort de guerre"
    routes: ["Mer d'Ashraal (pirates)", "Piste du Soufre"]

  - nom: "Le Commerce du Froid"
    participants: ["Helrün", "Eldaron"]
    flux: "Glace/Sel ↔ Armes/Outils"
    risques: "Naufrages fréquents, raids des tribus côtières."

# SYSTÈME FISCAL (OPPRESSIF)
systeme_fiscal:
  echelle_mondiale:
    - nom: "Droit de Passage"
      taux: "Arbitraire (souvent 10% de la cargaison)"
      perception: "Gardes armés aux frontières et cols"

  echelle_continentale:
    - continent: "Eldaron"
      taxes: ["La Dîme du Roi (20% récoltes)", "Taxe de Taille (par tête)", "Gabelle du Sel"]
      consequence: "Révoltes paysannes fréquentes."

    - continent: "Varnäl"
      taxes: ["Tribut de la Forêt (offrandes obligatoires)", "Droit de Coupe (payé en sang ou or)"]

    - continent: "Iskarion"
      taxes: ["L'Or du Temple (impôt religieux strict)", "Taxe de l'Eau (vitale)"]

    - continent: "Thaurgrim"
      taxes: ["Taxe du Marteau (sur la production)", "Tribut de Protection (payé aux clans dominants)"]

    - continent: "Helrün"
      taxes: ["Part du Jarl (butin de raid)", "Droit de Feu (bois de chauffage)"]

# GUILDES ET CORPORATIONS (MAFIAS MÉDIÉVALES)
guildes_influentes:
  - nom: "La Ligue des Nautes"
    specialite: "Transport maritime et Contrebande"
    siege: "Lirn / Territoires flottants"
    influence: "Peuvent affamer une ville côtière en bloquant le port."
    reputation: "Impitoyables, vendent leurs services au plus offrant."

  - nom: "Le Marteau Noir"
    specialite: "Armement et Esclavage minier"
    siege: "Vulkar"
    influence: "Monopole sur l'acier de qualité supérieure."

  - nom: "Les Coupeurs de Rhaal"
    specialite: "Extraction de bois rare"
    siege: "Enclave fortifiée en lisière de Rhaal"
    methodes: "Utilisent des forçats pour les zones dangereuses de la forêt."

# COÛT DE LA VIE (SURVIE)
couts_de_vie_par_region:
  - region: "Valnoria (Eldaron)"
    niveau_vie: "Disparate (Nobles riches / Paysans affamés)"
    repas_simple: "Pain noir et brouet (Cher en hiver)"
    danger: "Basse-ville coupe-gorge la nuit"

  - region: "Lisière de Rhaal (Varnäl)"
    niveau_vie: "Sauvage"
    repas_simple: "Chasse ou cueillette (Risque d'empoisonnement)"
    troc: "Privilégié sur la monnaie"

  - region: "Cités-Forges (Thaurgrim)"
    niveau_vie: "Dur"
    repas_simple: "Rations industrielles (pâte nutritive)"
    logement: "Dortoirs collectifs insalubres"

# CRISES ÉCONOMIQUES ET DÉFIS
defis_economiques:
  - nom: "La Rouille des Blés"
    description: "Maladie fongique attaquant les récoltes d'Eldaron"
    impact: "Prix du pain x10, émeutes de la faim à Lorn"

  - nom: "Blocus des Glaces"
    description: "Hiver trop rigoureux empêchant les navires d'Helrün de descendre"
    impact: "Pourrissement des stocks de viande au sud, famine"

  - nom: "Guerre des Clans Thaurgrims"
    description: "Conflit interne pour le contrôle d'une veine de fer pur"
    impact: "Arrêt des exportations d'armes, vulnérabilité des autres royaumes"

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 2.0_grim_dark
  type_contenu: "economie_medievale_realiste"
  ambiance: "Low Fantasy, Pénurie, Corruption"