    subdivisions: ["Écu (1/4 couronne)", "Livre (1/20 couronne)", "Denier (1/100 couronne)"]
    taux_change_fixe: "1 Couronne = 20 Livres = 100 Deniers"
    materiau: "Alliage argent-fer (résistant à l'humidité et à la chaleur)"

  monnaies_regionales:
    - nom: "Pierre Solaire"
      region: "Iskarion"
      valeur: "0.8 Couronne"
      utilisation: "Commerce énergétique et transactions sacrées"
      particularite: "Pierre imprégnée d'énergie solaire, valeur fluctuante selon la saison"

    - nom: "Sceau de Glace"
      region: "Helrün"
      valeur: "1.2 Couronne"
      utilisation: "Commerce de la glace noire et du sel fossile"
      particularite: "Cristal d'Ygral gravé, valeur stable grâce à la rareté"

    - nom: "Masse de Cendre"
      region: "Thaurgrim"
      valeur: "0.6 Couronne"
      utilisation: "Commerce des cendres fertilisantes et du soufre"
      particularite: "Compressé de cendres volcaniques, valeur liée à la fertilité"

    - nom: "Souffle de Rhaal"
      region: "Varnäl"
      valeur: "1.5 Couronne"
      utilisation: "Commerce du bois et produits biologiques"
      particularite: "Ambre organique imprégné d'oxygène pur, valeur écologique"

    - nom: "Couronne Eldarienne"
      region: "Eldaron"
      valeur: "1.0 Couronne (référence)"
      utilisation: "Commerce intercontinental et réserves"
      particularite: "Monnaie de référence continentale, acceptée partout"

