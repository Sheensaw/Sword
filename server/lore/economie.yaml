# economie.yaml
modele: "hybride_ia_semantique"
description: "Système économique complet de Velkarum - Échelles mondiale, régionale et nationale"

# SECTION OPTIMISÉE POUR L'EMBEDDING SEMANTIQUE
embedding_optimized:
  themes: ["économie", "commerce", "monnaie", "ressources", "échanges", "marchés", "production"]
  mots_cles: ["couronne_eldarienne", "glace_noire", "cendres_fertilisantes", "bois_rhall", "commerce_intercontinental", "taxes", "guildes"]
