# economie.yaml
# AUDIT STATUS: OPTIMIZED (Conforme au Canon de l'Architecte v1.0)
modele: "low_fantasy_grim_realistic"
description: "Système économique de Velkarum - Un réseau mondial de dépendance mutuelle, gangrené par la dette, l'inflation et des logistiques mortelles."

# 1. EMBEDDING SOMBRE & RÉALISTE
embedding_optimized:
  themes: ["interdépendance_critique", "capitalisme_prédateur", "famine_logistique", "dette_souveraine", "monopoles_naturels"]
  mots_cles: ["lettre_de_change", "inflation_calorique", "guerre_des_prix", "usure_bancaire", "servage_pour_dette"]
  description_semantique: "L'argent est le véritable dieu de ce monde. Les royaumes ne s'effondrent pas à cause des dragons, mais parce qu'ils ne peuvent plus payer les intérêts de leurs emprunts aux banques d'Iskarion."
  tonalite_audit: "Grimdark Consistent - La pauvreté n'est pas un accident, c'est un outil de contrôle social. Si les gens n'avaient pas faim, ils se révolteraient."

# 2. SYSTÈME MONÉTAIRE (CHAOS MÉTALLIQUE)
monnaies_mondiales:
  - nom: "Le Tola Solaire (Iskarion)"
    type: "Étalon-Or (Réserve Mondiale)"
    valeur_ref: "1 Tola = 20 Couronnes (Taux officiel, mais 35 au marché noir)"
    statut: "Monnaie des Rois et des Assassins. Sa pureté est garantie par le clergé. Falsifier un Tola est une hérésie punie par le plomb fondu."
    usage: "Grosses transactions internationales, achat d'esclaves de luxe, paiement des mercenaires d'élite."

  - nom: "La Couronne de Fer (Eldaron)"
    type: "Monnaie Fiat Dévaluée"
    probleme: "Le Roi réduit la teneur en argent des pièces à chaque guerre. Une 'Vielle Couronne' (avant-guerre) vaut 3 'Nouvelles Couronnes'."
    consequence: "Les marchands pèsent chaque pièce. L'inflation galope : le prix du pain change le matin et le soir."

  - nom: "La Plaque (Thaurgrim)"
    type: "Monnaie-Marchandise (Poids)"
    forme: "Carrés de métal industriel standardisé (Fer, Cuivre, Acier) estampillés par les Clans."
    usage: "On ne paie pas avec, on troque du poids de métal utile. C'est lourd, sale, mais ça a une valeur réelle indiscutable. Accepté partout par les forgerons."

  - nom: "Le Baril (Helrün)"
    type: "Étalon-Énergie"
    valeur: "Basée sur l'huile de baleine (Lumière/Chauffage). Au Nord, l'or ne vaut rien s'il ne peut pas être brûlé pour se chauffer."

# 3. INDICES DES PRIX (L'ÉCHELLE DE LA MISÈRE)
# Note : Salaire journalier moyen d'un ouvrier non qualifié (Bras-Nu) = 2 Couronnes.

cout_de_la_vie:
  pain_1kg:
    Eldaron (Été): "0.5 Couronne (Abordable)"
    Eldaron (Hiver): "4 Couronnes (Famine des pauvres)"
    Thaurgrim: "8 Couronnes (Luxe importé)"
    Iskarion: "3 Couronnes (Subventionné pour les citoyens, 10 pour les autres)"

  eau_1L:
    Eldaron: "Gratuit (Puits/Rivière)"
    Iskarion: "2 Couronnes (Plus cher que le vin médiocre). Rationnée."
    Thaurgrim: "1 Couronne (L'eau gratuite est toxique/acide)."

  vie_humaine (Esclave de labeur):
    Thaurgrim: "50 Plaques (Moins cher qu'une bonne pelle). L'homme est jetable."
    Iskarion: "200 Tolas (Cher, symbole de statut. Un esclave assoiffé est un mauvais investissement)."
    Eldaron: "Illégal (Mais on peut acheter la 'Dette' d'un serf pour 100 Couronnes, ce qui revient au même)."

  equipement_militaire:
    Epee_acier_correct: "500 Couronnes (250 jours de salaire d'un paysan). Explique pourquoi les paysans se battent avec des fourches."
    Armure_complete: "50 Tolas (Le prix d'un village). Seuls les nobles en ont."

# 4. INSTITUTIONS FINANCIÈRES (LES VRAIS MAÎTRES)
banques_et_guildes:
  - nom: "La Banque du Zénith (Siège : Asuren)"
    type: "Créancier Mondial"
    pouvoir: "Détient la dette souveraine d'Eldaron (12 Millions de Tolas). Peut déclencher une famine en refusant une lettre de crédit pour l'achat de semences."
    bras_arme: "Les Huissiers Gris (Assassins-Comptables qui 'liquident' les mauvais payeurs)."

  - nom: "La Ligue des Nautes (Siège : Lirn)"
    type: "Cartel Logistique"
    monopole: "Contrôle 80% du fret maritime. Ils décident qui mange et qui a faim en fixant les tarifs du transport."
    methode: "Le 'Blocus Silencieux'. Si une ville taxe trop les navires, plus aucun bateau n'accoste. La ville meurt en 2 mois."

  - nom: "Le Consortium du Fer (Siège : Vulkar)"
    type: "Syndicat Industriel"
    fonction: "Fixe les quotas de production d'acier. Vend des armes aux deux camps de chaque guerre pour maximiser les profits."

# 5. FLUX COMMERCIAUX (LES ARTÈRES DU MONDE)
chaines_valeur:
  - nom: "Le Cycle de la Faim (Eldaron -> Thaurgrim)"
    flux: "Blé contre Engrais/Acier."
    risque: "Si le flux s'arrête, double famine (Eldaron manque de pain l'année suivante faute d'engrais, Thaurgrim meurt de faim le mois même)."

  - nom: "Le Cycle du Froid (Helrün -> Iskarion)"
    flux: "Glace Noire contre Or."
    risque: "Vital pour Iskarion. Sans glace, les stocks de médicaments de Zhaïr pourrissent en 3 jours."

  - nom: "Le Cycle de la Douleur (Varnäl -> Monde)"
    flux: "Opium/Poisons contre Or/Verre."
    risque: "Monopole absolu. Varnäl fixe les prix. L'addiction de la noblesse mondiale assure une demande inélastique."

# 6. CRISES ÉCONOMIQUES (STRESS-TESTS)
scenarios_catastrophe:
  - nom: "L'Inflation du Charbon"
    cause: "Une grève minière ou un effondrement de tunnel à Thaurgrim."
    effet: "Le prix du chauffage triple à Eldaron. Les pauvres meurent de froid ou brûlent leurs meubles (puis leurs maisons)."

  - nom: "La Panique des Tulipes Noires"
    cause: "Spéculation sur un remède miracle venant de Varnäl."
    effet: "Bulle financière qui éclate, ruinant la classe marchande d'Ardel. Suicide de masse des banquiers."

  - nom: "La Crise de Liquidité Royale"
    cause: "Le Roi d'Eldaron ne peut plus payer les mercenaires."
    effet: "Les mercenaires se paient 'sur la bête' (pillage des propres villes d'Eldaron). Chaos social."

# 7. LOGISTIQUE & RISQUES
transport:
  cout_transport: "Le transport terrestre double le prix d'une marchandise tous les 300km (taxes, gardes, pertes). Le transport maritime est 10x moins cher (d'où l'importance des ports)."
  pertes_moyennes: "20% des cargaisons sont perdues (Pirates de Lirn, Tempêtes, Monstres). C'est intégré dans le prix de vente."
  assurance: "Seule la Ligue des Nautes assure les cargaisons. Taux usuraire : 30% de la valeur déclarée."

# 8. MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-23"
  version: 4.0_optimized_audit
  type_contenu: "manuel_economie_politique_dark"
  note_intention: "Montrer que l'économie est une arme. La pauvreté structurelle est nécessaire au système pour forcer les gens à faire les travaux dangereux (mines, armée, colonisation)."