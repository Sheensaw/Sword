# eldaron.yaml
modele: "low_fantasy_grim"
description: "Continent Eldaron - Féodalité, intrigues politiques et misère rurale"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["feodalite", "guerre_civile", "peste", "corruption", "chevalerie_brutale", "inquisition"]
  mots_cles: ["lorn", "roi_faible", "jacqueries", "boue", "dime", "inquisiteurs"]
  description_semantique: "Un royaume médiéval classique mais sale et brutal. La noblesse écrase le peuple, les maladies sont fréquentes, et l'autorité royale est contestée."

# DONNÉES FONDAMENTALES
nom: "Eldaron"
designation: "Les Terres du Roi"
type: "Continent tempéré"
superficie_mkm2: 35.5
population_estimee_millions: 62 (Majorité paysanne pauvre)
systeme_coordonnees: "grid_eldarien_100x100"

# RÉGIONS GÉOPOLITIQUES
regions:
  - nom: "Le Val de Lorn (Valnoria)"
    coordonnees: { x_min: 30, x_max: 60, y_min: 40, y_max: 70 }
    biome_principal: "Plaines agricoles boueuses"
    capitale: "Lorn"
    etat: "Surpeuplé, déboisé, terres épuisées."
    pouvoir: "Contrôlé directement par la Couronne, mais infiltré par les Guildes."

  - nom: "Les Marches du Dalen"
    coordonnees: { x_min: 15, x_max: 45, y_min: 65, y_max: 85 }
    biome_principal: "Forêts denses et brumeuses"
    capitale: "Dalen"
    ambiance: "Territoire de chasse, superstitions, peur des 'Choses' de la forêt."
    population: "Bûcherons bourrus, Elfes renégats vivant en clans sauvages."

  - nom: "Les Terres du Sud (Ardel)"
    coordonnees: { x_min: 45, x_max: 80, y_min: 20, y_max: 45 }
    biome_principal: "Collines sèches et vignobles"
    capitale: "Ardel"
    ambiance: "Riche, corrompue, influence étrangère (Iskarion)."
    conflit: "Les ducs du Sud menacent souvent de faire sécession."

  - nom: "Le Ferharn (Principauté Naine)"
    coordonnees: { x_min: 65, x_max: 90, y_min: 45, y_max: 70 }
    biome_principal: "Montagnes fortifiées"
    capitale: "Ferharn"
    description: "Forteresses imprenables. Les Nains ici sont des isolationnistes xénophobes qui vendent leur acier au prix fort."

  - nom: "La Côte des Naufrageurs (Lirn)"
    coordonnees: { x_min: 5, x_max: 30, y_min: 30, y_max: 60 }
    capitale: "Lirn"
    ambiance: "Brumeuse, salée. La loi du Roi s'arrête aux portes de la ville."

# VILLES PRINCIPALES (CLOAQUES URBAINS)
villes_principales:
  - nom: "Lorn"
    type: "Capitale Impériale"
    coordonnees: { x: 45, y: 55 }
    population: 4200000 (Entassés)
    description: "Une mégalopole de bois et de pierre, aux rues étroites et boueuses. Le château royal domine une mer de taudis."
    problemes: "Épidémies récurrentes, criminalité endémique, émeutes du pain."

  - nom: "Ardel"
    type: "Cité des Marchands"
    coordonnees: { x: 60, y: 35 }
    description: "Plus propre que Lorn, mais cruelle. L'argent y achète tout, même la vie."

  - nom: "Khar-Ghul"
    type: "Bastion Militaire"
    coordonnees: { x: 85, y: 80 }
    description: "Une forteresse de pierre grise, garnison de soldats endurcis surveillant les tribus barbares de l'Est."

# SOCIÉTÉ ET POLITIQUE
structure_sociale:
  - "Haute Noblesse : Complots, mariages arrangés, décadence."
  - "Clergé : Puissant, intolérant, prélève la dîme avec force."
  - "Bourgeoisie : Guildes marchandes qui achètent les nobles endettés."
  - "Peuple : Paysans attachés à la terre (serfs), ouvriers urbains misérables."

conflits_internes:
  - "Guerre de Succession latente : Le Roi Alaric est vieux et malade, ses fils se haïssent."
  - "Révoltes Paysannes : Les 'Jacques' brûlent régulièrement les châteaux des petits seigneurs."

# INFRASTRUCTURES
routes_principales:
  - "La Voie Royale : Seule route pavée décente, mais les péages sont exorbitants."
  - "Le Chemin des Pendus : Route vers le Nord, ainsi nommée à cause des bandits exécutés le long du chemin."

# RELATIONS INTERNATIONALES
diplomatie:
  - "Dépendance vitale aux cendres de Thaurgrim pour l'agriculture."
  - "Méfiance envers les 'sauvages' de Varnäl."
  - "Dettes massives envers les banquiers d'Iskarion."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 3.2_grim
  type_contenu: "geographie_medievale_realiste"