# DESCRIPTION NARRATIVE SYNTHÈSE COMPLÈTE ET COHÉRENTE
description_narrative: |
  Eldaron s'étend comme une tapisserie vivante de huit régions aux identités marquées. 
  Au centre, le Royaume de Valnoria domine les plaines fertiles du Draen, avec sa capitale Lorn 
  (45,55) qui rayonne d'influence politique et culturelle. De Lorn part la Voie Royale du Draen 
  (850 km) vers Dorr (50,60) à 180 km au nord-est et Ardel (60,35) à 280 km au sud-est, 
  charriant céréales et marchandises dans les deux directions.
  
  À l'ouest, les Ligues Côtières de Lirn (15,45) contrôlent la Route Côtière du Fer-Bleu 
  (1200 km) qui relie la capitale aux ports maritimes, formant un arc de 450 km jusqu'à Lorn 
  puis 350 km jusqu'à Draenport. Plus au nord, les Marches du Dalen abritent la cité forestière 
  de Dalen (30,75), départ du Chemin des Forêts (600 km) qui serpente vers le nord sur 150 km 
  vers les sanctuaires elfiques des Cercles Lunaires (25,80) puis 200 km vers l'est jusqu'à 
  l'Arbre-Monde (35,85).
  
  À l'est, la Principauté de Ferharn (75,55) commande la Route des Mines (450 km) qui 
  approvisionne Ardel en minerais et armes sur 300 km vers le sud-ouest, tandis que plus 
  au nord-est, la forteresse de Khar-Ghul (85,80) garde les Marches Orientales disputées 
  à 350 km de Ferharn. Au sud, le Delta du Draen abrite Draenport (35,15), accessible 
  par la Voie du Delta (300 km) qui traverse les marais sur 100 km vers l'ouest jusqu'au 
  Temple de Syl-Mara (30,12) et 150 km vers l'est jusqu'au Marais aux Perles (40,18).
  
  Les Terres Tribales du Nord voient circuler la Piste Nomade (800 km) des centaures, 
  suivant un cycle saisonnier des Plaines Nord (35,85) à 250 km vers la Vallée Centrale (40,65) 
  puis 300 km vers les Collines Sud (50,45). Chaque route a sa fonction et sa longueur : 
  la Voie Royale (850 km) pour le commerce, le Chemin des Forêts (600 km) pour les pèlerinages, 
  la Route des Mines (450 km) pour l'industrie, et la Piste Nomade (800 km) pour les migrations ancestrales.
  
  Les croisements stratégiques sont nombreux : Dorr (50,60) connecte la Voie Royale aux 
  routes forestières, Ardel (60,35) relie le commerce du sud aux mines de l'est, et Lorn 
  (45,55) reste le carrefour incontournable de toutes les routes continentales.
  
  Cet équilibre de routes spécialisées et de régions complémentaires fait d'Eldaron 
  le cœur battant de Velkarum, où chaque déplacement de 100 km représente une journée 
  de voyage et où aucun point n'est à plus de 15 jours de la capitale.

