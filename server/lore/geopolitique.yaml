# geopolitique.yaml
modele: "low_fantasy_grim"
description: "Système géopolitique - Guerres, Alliances fragiles et Intrigues"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["guerre", "trahison", "espionnage", "crise_alimentaire", "realpolitik"]
  mots_cles: ["conseil_fantoche", "menace_guerre", "blocus", "assassinat", "mariage_force"]
  description_semantique: "Un monde au bord de l'effondrement. La paix n'est qu'une période de préparation à la guerre suivante."

# PUISSANCES ET DIRIGEANTS (MACHIAVÉLIQUES)
gouvernements:
  - continent: "Eldaron"
    dirigeant: "Roi Alaric VI 'Le Goutteux'"
    etat: "Vieux, paranoïaque, manipulé par ses conseillers."
    objectif: "Maintenir l'unité du royaume face aux ducs rebelles."

  - continent: "Varnäl"
    dirigeant: "Le Cercle des Anciennes (Matriarcat)"
    politique: "Isolationnisme agressif. Tuet tout intrus dans la forêt sacrée."
    objectif: "Empêcher l'exploitation de Rhaal par les étrangers."

  - continent: "Iskarion"
    dirigeant: "Grand Inquisiteur Zephyros"
    politique: "Expansionnisme religieux."
    objectif: "Convertir ou asservir les 'impurs' du Nord."

  - continent: "Thaurgrim"
    dirigeant: "Seigneur de Guerre Vulkan"
    politique: "Dictature militaire industrielle."
    objectif: "Vendre des armes à tout le monde pour financer sa propre domination."

  - continent: "Helrün"
    dirigeant: "Jarl Hrothgar 'Dents-de-Loup'"
    politique: "Razzias saisonnières."
    objectif: "Nourrir son peuple par le pillage des côtes d'Eldaron."

# ALLIANCES (FRAGILES)
alliances:
  - nom: "Le Pacte du Fer et du Blé"
    membres: ["Eldaron", "Thaurgrim"]
    nature: "Purement économique. Ils se détestent mais ont besoin l'un de l'autre."
    statut: "Tendu. Thaurgrim augmente les prix des cendres, Eldaron menace de couper le grain."

  - nom: "L'Accord de Non-Agression Maritime"
    membres: ["Ligues de Lirn", "Asuren"]
    nature: "Partage des zones de piraterie/commerce."
    statut: "Violé régulièrement par des corsaires 'indépendants'."

# CONFLITS EN COURS
guerres:
  - nom: "La Guerre des Frontières (Est d'Eldaron)"
    description: "Escarmouches constantes entre les légions royales et les tribus barbares."
    pertes: "Élevées. Pas de gain territorial."

  - nom: "Le Blocus du Fer-Bleu"
    description: "Les navires d'Iskarion harcèlent les navires marchands venant d'Helrün."
    enjeu: "Contrôle des routes maritimes."

  - nom: "La Purge Silencieuse (Varnäl)"
    description: "Les Varnäliens éliminent systématiquement les camps de bûcherons illégaux."
    type: "Guérilla brutale. Pièges, poisons, flèches invisibles."

# POINTS CHAUDS
zones_tension:
  - "Le Détroit du Fer-Bleu : Goulet d'étranglement maritime infesté de pirates."
  - "Les Mines Frontalières : Thaurgrim empiète sur le territoire d'Eldaron."
  - "Les Bas-Quartiers de Lorn : Poudrière sociale prête à exploser."

# PERSONNAGES INFLUENTS (NON-DIRIGEANTS)
acteurs_cles:
  - nom: "Lady Seraphina (Maîtresse des Espions)"
    role: "Vend des informations à toutes les cours."
    localisation: "Ardel"

  - nom: "Général Kael (Mercenaire)"
    role: "Chef de la Compagnie Noire. Dispose d'une armée privée capable de renverser un petit royaume."

  - nom: "L'Oracle Aveugle (Helrün)"
    role: "Guide spirituel fanatique prêchant la guerre contre le Sud."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 1.0_grim
  type_contenu: "geopolitique_realiste"