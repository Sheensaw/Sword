  commerce_principal:
    exportations_helrun: ["sel fossile", "glace noire", "fourrures", "cristaux d'Ygral"]
    importations_eldaron: ["outils métalliques", "céréales", "textiles", "argile cuite"]
  routes_commerciales:
    - "Voie Maritime du Fer-Bleu : Nerr (25,15) ↔ Lirn (15,45) - 600 km"
    - "Canal du Drann-Draen : Sources (65,80) ↔ Lorn (45,55) - 2100 km total"

