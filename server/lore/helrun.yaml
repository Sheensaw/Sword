# DESCRIPTION NARRATIVE SYNTHÈSE COMPLÈTE ET COHÉRENTE
description_narrative: |
  Helrun s'étend comme un royaume de glace et de brumes, structuré en cinq régions 
  aux spécialisations complémentaires. Au sud-ouest, le Territoire des Clans du Nerr (25,15) 
  domine le commerce du sel fossile et de la glace noire, connecté par la Voie des Fjords 
  (800 km) qui serpente le long des côtes jusqu'à Narvik (55,30) à 400 km au nord-est.
  
  Les vastes Domaine des Tribus du Nar s'étendent au centre, où la Piste de la Toundra 
  (600 km) relie Narvik aux contreforts du Royaume Montagnard du Skarnheim (75,55) 
  sur 300 km vers l'est. Skarnheim, perchée à 1250m d'altitude, commande le Chemin des Montagnes 
  (450 km) qui mène aux Sanctuaires des Ermites du Drann à Ygral (55,75), à 250 km au nord.
  
  À l'ouest, les Territoires des Nautes du Draen contrôlent la Route du Fer-Bleu (1200 km), 
  voie maritime vitale qui connecte Helrun à Eldaron via le Canal du Drann (2100 km) 
  prenant sa source près d'Ygral et émergeant près de Nerr.
  
  Chaque route a sa spécificité : la Voie des Fjords pour le commerce côtier, 
  la Piste de la Toundra pour les échanges tribaux, le Chemin des Montagnes pour 
  les pèlerinages, la Route du Fer-Bleu pour le commerce international, et le 
  Canal du Drann pour la recherche scientifique.
  
  Cet équilibre entre régions côtières, intérieures et montagnardes fait d'Helrun 
  le régulateur thermique de Velkarum, où chaque déplacement doit composer avec 
  les conditions polaires et où les voyages entre régions prennent de 3 à 15 jours 
  selon les saisons et les conditions glaciaires.

