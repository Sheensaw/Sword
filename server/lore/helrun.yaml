# helrun.yaml
modele: "low_fantasy_grim"
description: "Continent Helrun - Survie polaire, tribus barbares et désolation"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["froid_mortel", "survie", "cannibalisme_de_survie", "raids", "vikings_inuit_dark"]
  mots_cles: ["skarnheim", "glace_noire", "drakkars", "famine_hivernale", "chamanisme_sanglant"]
  description_semantique: "Un enfer blanc. La civilisation ici se résume à ne pas mourir de froid ou de faim. Les faibles sont abandonnés."

# DONNÉES FONDAMENTALES
nom: "Helrun"
designation: "Le Tombeau Blanc"
type: "Continent polaire"
superficie_mkm2: 29.4
population_estimee_millions: 3.8 (Faible densité)
systeme_coordonnees: "grid_helrunien_100x100"

# RÉGIONS GÉOPOLITIQUES
regions:
  - nom: "La Côte des Os (Nerr)"
    coordonnees: { x_min: 10, x_max: 40, y_min: 5, y_max: 30 }
    biome_principal: "Fjords glacés"
    capitale: "Nerr"
    activite: "Pêche (baleine, phoque), départ des raids."
    ambiance: "Villages fortifiés, odeur de graisse de phoque et de fumée."

  - nom: "Le Désert Blanc (Nar)"
    coordonnees: { x_min: 35, x_max: 75, y_min: 15, y_max: 45 }
    biome_principal: "Toundra et inlandsis"
    population: "Nomades suivant les troupeaux de rennes."
    danger: "Blizzards capables de tuer en une heure. Meutes de loups géants."

  - nom: "Les Pics du Vent (Skarnheim)"
    coordonnees: { x_min: 60, x_max: 95, y_min: 40, y_max: 70 }
    biome_principal: "Hautes montagnes"
    capitale: "Skarnheim"
    description: "Forteresse taillée dans la roche et la glace. Siège du Jarl."
    ressources: ["Mines de fer froid", "Glace Noire (extraite des glaciers profonds)"]

  - nom: "Les Grottes du Drann"
    coordonnees: { x_min: 45, x_max: 65, y_min: 65, y_max: 85 }
    biome_principal: "Réseau souterrain"
    population: "Ermites, parias, 'Ceux qui vivent dessous'."
    reputation: "On dit qu'ils mangent leurs morts pour survivre."

# VILLES PRINCIPALES (ABRIS DE FORTUNE)
villes_principales:
  - nom: "Skarnheim"
    type: "Citadelle du Jarl"
    coordonnees: { x: 75, y: 55 }
    population: 300000
    description: "Sombre, enfumée, chauffée par des feux de tourbe. Les murs sont couverts de peaux."

  - nom: "Nerr"
    type: "Port de Raid"
    coordonnees: { x: 25, y: 15 }
    activite: "Commerce avec les contrebandiers du sud. Vente d'esclaves capturés."

# CULTURE ET SURVIE
coutumes_brutales:
  - "Le Grand Sommeil : Les vieillards qui ne peuvent plus travailler partent volontairement dans le blizzard pour ne pas être une charge."
  - "Le Partage du Sang : Lors des chasses, boire le sang chaud de la proie est un rituel vital."
  - "Loi du Fer : Tout conflit se règle par le duel."

# RESSOURCES
ressources:
  - "Glace Noire : Glace extrêmement dense qui ne fond pas facilement. Vendue à prix d'or au sud pour conserver les aliments des rois."
  - "Fourrures : Vitales pour le commerce."
  - "Huile de baleine : Combustible."

# CLIMAT
conditions:
  - "Hiver : Dure 9 mois. Nuit perpétuelle."
  - "Été : 3 mois de boue et de fonte des glaces. Saison de la guerre."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 3.2_grim
  type_contenu: "continent_polaire_dark"