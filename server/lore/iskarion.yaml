# DESCRIPTION NARRATIVE SYNTHÈSE COMPLÈTE ET COHÉRENTE
description_narrative: |
  Iskarion s'étend comme un continent de feu et de lumière, structuré en cinq régions
  aux spécialisations énergétiques complémentaires. Au nord, le Royaume Solaire du Zhaïr (35,75)
  domine la spiritualité avec ses temples pyramidaux, connecté par la Voie Solaire (900 km)
  qui descend vers Shaar-Keth (55,45) à 400 km au sud-est puis Korra (45,20) à 500 km au sud.

  Les Territoires du Rift Shaar forment un arc volcanique au centre, où le Chemin du Rift
  (450 km) relie Shaar-Keth aux sources géothermiques profondes. À l'est, la Confédération
  des Plateaux de Surn rayonne depuis Vethar (75,55), connectée par la Route des Plateaux
  (750 km) qui mène à Shaar-Keth puis au port d'Asuren (15,35) à 600 km à l'ouest.

  Au sud, le Sultanat du Désert de Korra contrôle la Piste des Vents (1200 km), route
  caravanière vitale traversant les dunes de sable-rouge. À l'ouest, les ligue Maritimes
  d'Asuren commandent la Route Maritime du Surn (2000 km), artère commerciale vers Thaurgrim
  et Varnäl.

  Chaque route a sa spécificité : la Voie Solaire pour les pèlerinages et le commerce de luxe,
  la Route des Plateaux pour l'industrie minière, la Piste des Vents pour les caravanes,
  le Chemin du Rift pour la recherche, et la Route Maritime pour le commerce international.

  Cet équilibre entre régions spirituelles, scientifiques, minières, désertiques et maritimes
  fait d'Iskarion le moteur énergétique de Velkarum, où chaque déplacement doit composer avec
  les extrêmes climatiques et où les voyages entre régions prennent de 5 à 25 jours selon
  les moyens de transport et les conditions atmosphériques.

