# iskarion.yaml
modele: "low_fantasy_grim"
description: "Continent Iskarion - Désert, fanatisme religieux et féodalité solaire"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["desert", "theocratie", "sacrifices", "chaleur", "miroirs_ardents", "soif"]
  mots_cles: ["zhaïr", "pretres_solaires", "eau_rare", "esclavage_dune", "inquisition_solaire"]
  description_semantique: "Une théocratie impitoyable où l'eau vaut plus que le sang. Les prêtres utilisent des miroirs pour brûler les hérétiques. La technologie est stagnante, remplacée par le dogme."

# DONNÉES FONDAMENTALES
nom: "Iskarion"
designation: "Les Terres Brûlées"
type: "Continent désertique et tropical"
superficie_mkm2: 41.7
population_estimee_millions: 40 (Concentrée dans les oasis et côtes)
systeme_coordonnees: "grid_iskarien_100x100"

# RÉGIONS GÉOPOLITIQUES
regions:
  - nom: "Le Domaine Sacré (Zhaïr)"
    coordonnees: { x_min: 20, x_max: 50, y_min: 60, y_max: 85 }
    biome_principal: "Désert de roches rouges"
    capitale: "Zhaïr"
    gouvernement: "Théocratie absolue"
    ambiance: "Processions religieuses, chaleur mortelle, silence imposé."
    particularites: ["Pyramides à sacrifices", "Miroirs d'exécution"]

  - nom: "La Faille du Rift (Shaar)"
    coordonnees: { x_min: 40, x_max: 70, y_min: 30, y_max: 60 }
    biome_principal: "Canyons géothermiques instables"
    capitale: "Shaar-Keth"
    population: "Parias, mineurs de soufre, lépreux exilés."
    danger: "Gaz toxiques, éboulements, chaleur extrême."

  - nom: "Les Sables Mouvants (Korra)"
    coordonnees: { x_min: 30, x_max: 65, y_min: 10, y_max: 35 }
    biome_principal: "Dunes infinies"
    capitale: "Korra"
    peuple: "Nomades pillards, marchands d'esclaves."
    ressource: "Sel, Verre de foudre (fulgurite)."

  - nom: "La Côte des Épices (Asuren)"
    coordonnees: { x_min: 5, x_max: 25, y_min: 20, y_max: 50 }
    biome_principal: "Littoral aride"
    capitale: "Asuren"
    ambiance: "Portuaire, cosmopolite mais ségréguée par caste religieuse."

# VILLES PRINCIPALES
villes_principales:
  - nom: "Zhaïr"
    type: "Cité-Temple"
    coordonnees: { x: 35, y: 75 }
    population: 2400000
    description: "Des murs blancs aveuglants. Les castes inférieures vivent dans des tunnels pour fuir le soleil. L'eau est rationnée par le clergé."

  - nom: "Asuren"
    type: "Port de Commerce"
    coordonnees: { x: 15, y: 35 }
    description: "Riche en apparence, mais gangrenée par la contrebande d'eau et d'esclaves."

# TECHNOLOGIE ET RELIGION
technologie_solaire:
  description: "Pas de magie, mais de l'optique primitive."
  miroirs_ardents: "Immenses disques de bronze poli utilisés pour concentrer la chaleur du soleil. Servent à allumer les feux sacrés, fondre le métal ou exécuter les condamnés."
  horloges_solaires: "Mesurent le temps de prière et de travail."

religion_dEtat:
  nom: "Le Culte du Disque"
  dogme: "Le Soleil est un dieu jaloux qui exige soumission et pureté."
  pratiques: "Jeûnes secs, flagellations, exécutions publiques à midi."
  inquisition: "Les 'Yeux du Soleil' traquent les hérétiques et les gaspilleurs d'eau."

# INFRASTRUCTURES
routes:
  - "La Piste des Os : Route caravanière traversant le désert. Jalonnée de squelettes d'animaux et d'hommes."
  - "La Voie Sacrée : Route pavée interdite aux roturiers."

# RESSOURCES
ressources_critiques:
  - "Eau : Contrôlée par les temples (Puissance politique absolue)."
  - "Or et Pierres précieuses : Abondants, mais ne se mangent pas."
  - "Verre : Meilleure qualité du monde connu."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 3.2_grim
  type_contenu: "geographie_desert_theocratie"