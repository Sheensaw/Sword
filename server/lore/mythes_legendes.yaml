# mythes_legendes.yaml
modele: "low_fantasy_grim"
description: "Légendes de Velkarum - Histoires de peur, d'avertissement et de monstres"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["peur", "monstres", "punition_divine", "malediction", "heros_dechus"]
  mots_cles: ["le_roi_fou", "la_grande_peste", "les_ombres", "fin_du_monde"]
  description_semantique: "Les mythes ne sont pas là pour inspirer, mais pour effrayer les enfants et expliquer pourquoi le monde est si dur. Pas de 'happy end'."

# LÉGENDES FONDATRICES (VERSION SOMBRE)
mythes_origines:
  - titre: "Le Fratricide Divin"
    culture: "Eldaron"
    recit: "Au commencement, deux frères dieux se battirent pour le trône céleste. Leur sang tomba sur terre et créa les hommes, condamnés à se battre éternellement comme leurs créateurs."
    morale: "La guerre est l'état naturel de l'homme."

  - titre: "La Trahison du Feu"
    culture: "Thaurgrim"
    recit: "Les hommes volèrent le feu aux profondeurs. En représailles, la terre jura de les brûler et de les étouffer à jamais."
    morale: "Tout progrès se paie par la souffrance."

  - titre: "Le Soleil Dévoreur"
    culture: "Iskarion"
    recit: "Le Soleil est un œil affamé. S'il ne reçoit pas assez d'offrandes, il se rapprochera jusqu'à tout calciner."
    morale: "Sacrifie ou brûle."

# CRÉATURES FOLKLORIQUES (BESTIAIRE EFFRAYANT)
creatures:
  - nom: "Les Goules des Tranchées"
    description: "Créatures nécrophages qui déterrent les morts des champs de bataille."
    croyance: "Ce sont les âmes des déserteurs maudits."

  - nom: "Le Marcheur de Brume"
    description: "Entité invisible qui enlève les voyageurs égarés dans les marais de Varnäl."
    signe: "Un silence soudain dans la jungle."

  - nom: "Les Wendigos (Helrün)"
    description: "Hommes ayant mangé de la chair humaine, transformés en monstres insatiables."
    réalité: "Probablement des fous rendus sauvages par la faim."

# LÉGENDES HISTORIQUES (RÉALITÉ DÉFORMÉE)
histoire_orale:
  - titre: "La Peste Noire d'Ardel"
    recit: "Une maladie envoyée par les dieux pour punir la cupidité des marchands. Elle tua la moitié du continent en un an."
    héritage: "Peur panique des rats et des étrangers malades."

  - titre: "Le Roi Fou Valdemar"
    recit: "Un roi qui emmurait ses femmes vivantes et parlait aux corbeaux. Il fut assassiné par sa propre garde."
    héritage: "Méfiance envers l'autorité royale absolue."

# PROPHÉTIES (FIN DU MONDE)
eschatologie:
  - "L'Hiver Éternel : Un jour, le soleil s'éteindra et le froid d'Helrün recouvrira tout Velkarum."
  - "Le Réveil du Grand Ver : Un monstre sous terre qui fera s'effondrer les continents."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 1.0_grim
  type_contenu: "folklore_horreur"