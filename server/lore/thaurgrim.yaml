# DESCRIPTION NARRATIVE SYNTHÈSE COMPLÈTE ET COHÉRENTE
description_narrative: |
  Thaurgrim s'étend comme un empire de feu et de pierre, structuré en cinq régions
  aux spécialisations volcaniques complémentaires. Au nord-est, le Royaume Volcanique 
  du Vulkar (75,70) domine la spiritualité et l'industrie lourde, connecté par la 
  Voie du Ghaarn (600 km) qui descend vers Drav (55,50) à 300 km au sud-ouest puis 
  Thun'ar (45,30) à 400 km au sud.

  Les Plaines Fertiles du Drav forment le grenier continental au centre, où la 
  Route des Cendres (800 km) relie Drav au port de Kaar (85,40) à 350 km à l'est
  puis à la frontière eldarienne. À l'ouest, les Hauts Plateaux de Derna rayonnent 
  depuis Derna (35,60), connectés par le Chemin des Forêts (450 km) qui serpente 
  vers les sanctuaires des Drakens.

  Au sud, les Côtes Géothermiques du Thun'ar contrôlent la Piste du Soufre (350 km),
  route industrielle vitale menant aux champs de soufre et à la Mer d'Ashraal.
  La Route Maritime du Surn (1500 km) connecte Kaar aux côtes iskariennes via le
  Golfe de Thun'ar.

  Chaque route a sa spécificité : la Voie du Ghaarn pour les pèlerinages et le 
  commerce sacré, la Route des Cendres pour l'exportation agricole, le Chemin des 
  Forêts pour l'artisanat, la Piste du Soufre pour l'industrie, et la Route 
  Maritime pour le commerce international.

  Cet équilibre entre régions sacrées, agricoles, forestières, industrielles et 
  maritimes fait de Thaurgrim le cœur magmatique de Velkarum, où chaque déplacement 
  doit composer avec l'activité volcanique et où les voyages entre régions prennent 
  de 4 à 20 jours selon l'activité sismique et les conditions atmosphériques.

