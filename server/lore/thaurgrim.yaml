# thaurgrim.yaml
modele: "low_fantasy_grim"
description: "Continent Thaurgrim - Terres de cendres, d'industrie primitive et de tyrannie clanique"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["volcans", "industrie_lourde", "esclavage", "pollution", "tyrannie", "fer_et_feu"]
  mots_cles: ["vulkar", "suie", "forçats", "clans_guerriers", "famine_noire", "souffre"]
  description_semantique: "Un continent étouffant sous la cendre. Une société industrielle primitive basée sur la force brute, l'esclavage et la maîtrise fanatique du feu."

# DONNÉES FONDAMENTALES
nom: "Thaurgrim"
designation: "La Terre des Cendres"
type: "Continent volcanique et industriel"
superficie_mkm2: 34.2
population_estimee_millions: 25 (dont 40% d'esclaves/serfs)
systeme_coordonnees: "grid_thaurgrimien_100x100"

# RÉGIONS GÉOPOLITIQUES (ENFERS INDUSTRIELS)
regions:
  - nom: "Le Creuset (Royaume du Vulkar)"
    coordonnees: { x_min: 60, x_max: 90, y_min: 60, y_max: 85 }
    biome_principal: "Désert de basalte et volcans actifs"
    capitale: "Vulkar"
    peuples_principaux: ["Thaurgrims (Maîtres)", "Esclaves de toutes races"]
    description: "L'air y est irrespirable sans filtre rudimentaire. Le ciel est noir en permanence."
    ressources: ["Fer", "Obsidienne", "Main d'œuvre forcée"]
    particularites: ["Forges monumentales à soufflets manuels", "Fosses communes", "Temples sacrificiels"]

  - nom: "Les Plaines de Suie (Drav)"
    coordonnees: { x_min: 40, x_max: 70, y_min: 40, y_max: 60 }
    biome_principal: "Steppes couvertes de cendre grise"
    capitale: "Drav"
    peuples_principaux: ["Serfs Thaurgrims", "Parias"]
    description: "Zone agricole misérable où l'on cultive des champignons géants et des lichens résistants sous la cendre."
    ressources: ["Cendres fertilisantes (récoltées à la main)", "Nourriture de base infecte"]
    particularites: ["Silos fortifiés", "Villages troglodytes pour fuir les pluies acides"]

  - nom: "La Forêt Pétrifiée (Derna)"
    coordonnees: { x_min: 20, x_max: 50, y_min: 50, y_max: 75 }
    biome_principal: "Arbres morts minéralisés"
    capitale: "Derna"
    peuples_principaux: ["Derniens (Humains adaptés)", "Exilés"]
    description: "Une forêt de pierre coupante. Les habitants y chassent des créatures cuirassées."
    ressources: ["Bois de pierre (aussi dur que le fer)", "Charbon de surface"]
    particularites: ["Fortins de bandits", "Carrières à ciel ouvert"]

  - nom: "Les Côtes Jaunes (Thun'ar)"
    coordonnees: { x_min: 30, x_max: 60, y_min: 20, y_max: 40 }
    biome_principal: "Littoral sulfureux"
    capitale: "Thun'ar"
    description: "L'odeur d'œuf pourri est omniprésente. L'eau y est toxique."
    ressources: ["Soufre (pour la poudre noire rudimentaire et l'alchimie)", "Sel acide"]
    particularites: ["Mines de soufre (espérance de vie : 25 ans)", "Ports fortifiés contre les pirates"]

# VILLES PRINCIPALES (CITE-USINES)
villes_principales:
  - nom: "Vulkar"
    type: "Capitale industrielle et religieuse"
    coordonnees: { x: 75, y: 70 }
    population: 1900000 (Surpeuplée)
    ambiance: "Bruit assourdissant des marteaux, chaleur étouffante, smog épais."
    lieux_cles: ["La Grand-Forge (Palais)", "Le Gouffre des Rebuts (Quartier bas)", "Marché aux Esclaves"]

  - nom: "Derna"
    type: "Bastion frontalier"
    coordonnees: { x: 35, y: 60 }
    ambiance: "Silencieuse, grise, méfiante. Maisons en pierre noire sans fenêtres."

  - nom: "Kaar"
    type: "Port Noir"
    coordonnees: { x: 85, y: 40 }
    population: 1000000
    ambiance: "Ville de marins, de prostitution et de crimes. La suie se mélange aux embruns."
    activite: "Exportation massive de cendres et d'armes."

# RÉSEAU ROUTIER (LOGISTIQUE DE GUERRE)
routes_principales:
  - nom: "La Voie du Fer"
    type: "Route pavée militaire"
    statut: "Entretenue par des forçats, patrouillée par des milices."
    danger: "Bandits de grand chemin, éboulements, coulées de lave occasionnelles."

  - nom: "La Piste des Cendres"
    type: "Route commerciale vers Eldaron"
    statut: "Poussiéreuse, balisée par des crânes sur des piques."
    trafic: "Convois lourds de chariots blindés."

# INTERACTIONS ET CONFLITS
relations_internes:
  - "Les Clans de Vulkar méprisent les agriculteurs de Drav, qu'ils considèrent comme du bétail."
  - "Derna est en quasi-rébellion, servant de refuge aux esclaves en fuite."

relations_externes:
  - "Eldaron : Client principal (dépendance alimentaire réciproque), mais ennemi historique."
  - "Iskarion : Rivalité pour le contrôle des minerais. Escarmouches fréquentes en mer."

# VOLCANS ET DANGERS NATURELS
volcans_majeurs:
  Ghaarn:
    statut: "Dieu-Volcan Actif"
    danger: "Eruptions fréquentes, pluies de lapilli, gaz toxiques inodores."
    culte: "On lui sacrifie les prisonniers de guerre pour apaiser sa colère."

# INFRASTRUCTURES
infrastructures:
  - "Les Grands Soufflets de Vulkar : Actionnés par des centaines d'hommes, ils alimentent les fourneaux."
  - "Les Canaux de Lave : Tranchées creusées pour diriger le magma vers les forges (extrêmement dangereux)."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 3.2_grim
  type_contenu: "geographie_dark_medieval"