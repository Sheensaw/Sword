# us_coutumes_peuples.yaml
modele: "low_fantasy_grim"
description: "Sociologie de Velkarum - Castes, Religions cruelles et Vie quotidienne"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["fanatisme", "hierarchie_stricte", "superstition", "fetes_paiennes", "xenophobie"]
  mots_cles: ["droit_cuissage", "inquisition", "serf", "paria", "rituel_sang"]
  description_semantique: "Les sociétés sont rigides et injustes. La religion est un outil de contrôle. L'étranger est toujours suspect."

# PEUPLES ET MENTALITÉS
peuples_principaux:
  - nom: "Eldariens (Valnari)"
    trait_dominant: "Arrogance et Servilité"
    social: "Féodalité stricte. Le noble a droit de vie et de mort sur le roturier."
    croyance: "Peur de l'Enfer et de la Sorcellerie."
    accueil: "Méfiance. Les étrangers sont souvent taxés ou chassés."

  - nom: "Thaurgrims"
    trait_dominant: "Brutalité et Discipline"
    social: "Militaro-industriel. Ta place dépend de ta force et de ta capacité à travailler."
    croyance: "Culte de la Force. Les faibles méritent leur sort."
    accueil: "Hostile. Les étrangers sont vus comme des espions ou des esclaves potentiels."

  - nom: "Iskari"
    trait_dominant: "Fanatisme et Caste"
    social: "Théocratie. Castes basées sur la pureté religieuse."
    croyance: "Le Soleil voit tout. Le péché doit être brûlé."
    accueil: "Condescendant. Tentatives de conversion forcée."

  - nom: "Varnäliens"
    trait_dominant: "Sauvagerie et Pragmatisme"
    social: "Tribal. Le chef est le plus fort ou le plus rusé."
    croyance: "Animisme sombre. Les esprits doivent être apaisés par le sang."
    accueil: "Mortel. Si vous n'êtes pas invité, vous êtes une proie."

  - nom: "Helruniens"
    trait_dominant: "Fatalisme et Solidarité clanique"
    social: "Clanique. La loyauté au Jarl est absolue."
    croyance: "Les Dieux sont cruels et indifférents. Il faut survivre malgré eux."
    accueil: "Froid. Partage du feu possible, mais vol puni de mort."

# RELIGIONS (OPIUM ET CONTRÔLE)
cultes:
  - nom: "L'Église du Père Sévère (Eldaron)"
    dogme: "Souffrir sur terre pour gagner le paradis. Obéir au Roi."
    pratiques: "Confession obligatoire, dîme, chasse aux sorcières."

  - nom: "Le Culte de la Fournaise (Thaurgrim)"
    dogme: "Le monde est un métal impur qui doit être forgé."
    pratiques: "Sacrifices humains dans la lave pour prévenir les éruptions."

  - nom: "L'Œil Solaire (Iskarion)"
    dogme: "La pureté par le feu."
    pratiques: "Purification des hérétiques par miroirs ardents."

  - nom: "Le Pacte Vert (Varnäl)"
    dogme: "Prendre et rendre. Une vie pour une vie."
    pratiques: "Cannibalisme rituel (manger la force de l'ennemi)."

# FÊTES ET TRADITIONS
festivals:
  - nom: "La Nuit des Longs Couteaux (Eldaron)"
    type: "Carnaval macabre"
    description: "Une nuit où l'ordre social est inversé. Souvent prétexte à des règlements de compte."

  - nom: "Le Jour de la Cendre (Thaurgrim)"
    type: "Commémoration"
    description: "Jeûne collectif pour se rappeler la Grande Famine."

  - nom: "La Chasse Sauvage (Helrün)"
    type: "Rite de passage"
    description: "Les jeunes doivent survivre une semaine seuls dans le blizzard."

# LOISIRS (RARES ET VIOLENTS)
divertissements:
  - "Combats de chiens ou de coqs."
  - "Exécutions publiques (très populaires)."
  - "Jeux de dés et de cartes (souvent truqués)."
  - "Bardes chantant des complaintes tragiques."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 1.0_grim
  type_contenu: "sociologie_dark_fantasy"