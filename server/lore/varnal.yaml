# varnal.yaml
modele: "low_fantasy_grim"
description: "Continent Varnäl - Jungle hostile, maladies et tribus xénophobes"

# EMBEDDING SOMBRE
embedding_optimized:
  themes: ["jungle_mortelle", "parasites", "tribus_sauvages", "isolationnisme", "poison", "nature_cruelle"]
  mots_cles: ["rhaal", "pourriture", "insectes_geants", "flechettes", "sacrifice_vert"]
  description_semantique: "La nature ici ne veut pas l'harmonie, elle veut vous manger. La croissance est rapide, la décomposition aussi. Les habitants sont des survivants impitoyables."

# DONNÉES FONDAMENTALES
nom: "Varnäl"
designation: "L'Enfer Vert"
type: "Continent équatorial"
superficie_mkm2: 32.6
population_estimee_millions: 54 (Dispersée)
systeme_coordonnees: "grid_varnälien_100x100"

# RÉGIONS GÉOPOLITIQUES
regions:
  - nom: "Le Cœur Noir (Rhaal)"
    coordonnees: { x_min: 20, x_max: 50, y_min: 60, y_max: 85 }
    biome_principal: "Jungle primaire impénétrable"
    capitale: "Rhaal"
    danger: "Prédateurs géants, plantes carnivores, tribus cannibales."
    description: "La lumière du soleil touche rarement le sol."

  - nom: "Les Marais de la Fièvre (Marael)"
    coordonnees: { x_min: 40, x_max: 70, y_min: 30, y_max: 60 }
    biome_principal: "Marécages pestilentiels"
    capitale: "Marael"
    danger: "Malaria, sangsues, sables mouvants."
    population: "Sorciers des marais, alchimistes douteux."

  - nom: "La Côte des Naufrages (Tarran)"
    coordonnees: { x_min: 5, x_max: 25, y_min: 20, y_max: 50 }
    biome_principal: "Mangroves et falaises"
    capitale: "Tarran"
    activite: "Seul point de contact avec l'extérieur. Comptoir commercial fortifié."

# VILLES PRINCIPALES (ORGANISATIONS TRIBALES)
villes_principales:
  - nom: "Rhaal"
    type: "Cité-Arbre Forteresse"
    coordonnees: { x: 35, y: 72 }
    description: "Construite dans la canopée pour échapper aux bêtes du sol. Reliée par des ponts de lianes piégés."

  - nom: "Marael"
    type: "Village sur Pilotis"
    coordonnees: { x: 55, y: 45 }
    description: "Cabanes pourrissantes au-dessus d'une eau noire. L'odeur de vase et de produits chimiques est insupportable."

  - nom: "Tarran"
    type: "Port Franc"
    coordonnees: { x: 15, y: 35 }
    description: "Une enclave de pierre entourée de palissades pour repousser la jungle. Lieu de tous les trafics."

# FLORE ET FAUNE (CAUCHEMARDESQUES)
ecosysteme:
  - "Arbres Étrangleurs : Parasitent les autres arbres et peuvent piéger les animaux."
  - "Mouches de Sang : Essaims capables de vider un homme de son sang."
  - "Spores Nécrotiques : Champignons qui infectent les poumons."
  - "Prédateurs : Reptiles géants, félins camouflés."

# PEUPLES ET COUTUMES
varnaliens:
  mentalite: "Tuer ou être tué. La pitié est une faiblesse."
  pratiques:
    - "Culte de la Décomposition : Les morts sont laissés à la forêt pour la nourrir."
    - "Chasse aux Têtes : Preuve de valeur guerrière."
    - "Usage des Poisons : Toutes leurs armes sont enduites de toxines."

# RESSOURCES
ressources_exportees:
  - "Bois de Fer : Extrêmement dur, mais coûteux en vies humaines à extraire."
  - "Poisons et Remèdes : Les deux faces de la même pièce."
  - "Animaux exotiques : Vendus pour les arènes d'Eldaron."

# INFRASTRUCTURES
routes:
  - "Aucune route pavée. Seulement des sentiers de chasse connus des seuls locaux."
  - "La Rivière du Serpent : Voie navigable mais infestée de crocodiles."

# MÉTA-DONNÉES IA
meta_ia:
  date_creation: "2025-11-05"
  version: 3.2_grim
  type_contenu: "continent_jungle_dark"