# ALLIANCES INTERCONTINENTALES MAJEURES
alliances_principales:
  - nom: "Conseil des Royaumes de Lorn"
    type: "Organisation diplomatique suprême"
    siege: "Lorn (45,55)"
    membres_fondateurs: ["Eldaron", "Varnäl", "Iskarion", "Thaurgrim", "Helrün"]
    objectif: "Maintien de la paix et coordination des échanges continentaux"
    pouvoirs: ["Arbitrage des conflits", "Gestion des crises", "Organisation de l'aide humanitaire"]
    reussites: ["Traité de stabilisation énergétique", "Protocole d'assistance écologique"]

  - nom: "Pacte du Triangle Énergétique"
    type: "Alliance économique et technologique"
    membres: ["Iskarion", "Thaurgrim", "Eldaron"]
    objectif: "Optimisation de la production et distribution d'énergie"
    benefices: ["+35% efficacité énergétique continentale", "Réduction de 40% des pénuries"]
    tensions_internes: "Concurrence technologique entre Iskari et Nains Thaurgriens"

  - nom: "Alliance du Feu et de la Glace"
    type: "Partenaire de recherche et développement"
    membres: ["Helrün", "Thaurgrim"]
    objectif: "Maîtrise des énergies extrêmes et régulation climatique"
    realisations: ["Système de refroidissement géothermale", "Stockage énergie dans glace noire"]
    importance: "Vital pour la stabilité volcanique et climatique"

  - nom: "Arc Nord Écologique"
    type: "Coopération environnementale"
    membres: ["Varnäl", "Helrün", "Eldaron"]
    objectif: "Préservation des écosystèmes et régulation climatique"
    actions: ["Banque de semences mondiale", "Protocoles de purification d'air", "Surveillance climatique"]

  - nom: "Ligue Maritime Commerciale"
    type: "Cartel commercial maritime"
    membres: ["Nautes du Draen", "Ligues Côtières de Lirn", "Territoires des Nautes du Draen"]
    objectif: "Contrôle et régulation du commerce maritime international"
    influence: "70% du transport maritime continental sous leur influence"

