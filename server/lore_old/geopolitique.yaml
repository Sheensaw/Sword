    manifestations: ["Augmentation des prix de 150%", "Restrictions d'exportation", "Tensions diplomatiques"]
    mediation: "Conseil des Royaumes tente une résolution négociée"
    intensite: "Élevée - Risque de pénurie alimentaire"

  - nom: "Tension Frontalière Orientale"
    parties: ["Marches Orientales d'Eldaron", "Territoires Gobelins non affiliés"]
    nature: "Conflit territorial et sécuritaire"
    causes: ["Expansion minière eldarienne", "Incursions gobelines", "Contrôle des ressources"]
    manifestations: ["Escarmouches frontalières", "Fortifications renforcées", "Embargo commercial"]
    mediation: "Négociations bloquées depuis 3 ans"
    intensite: "Moyenne - Conflit latent avec pics violents"

  - nom: "Conflit d'Influence en Mer d'Ashraal"
    parties: ["Thaurgrim", "Nautes du Draen"]
    nature: "Conflit d'accès aux ressources"
    causes: ["Contrôle des gisements de soufre", "Droits de navigation", "Installations industrielles"]
    manifestations: ["Blocus temporaires", "Sabotages industriels", "Guerre des prix"]
    mediation: "Tribunal maritime de Lirn saisi"
    intensite: "Moyenne - Impact sur l'industrie continentale"

  - nom: "Crise de Succession Helrunienne"
    parties: ["Clans du Nerr", "Tribus du Nar", "Montagnards du Skarnheim"]
    nature: "Conflit politique interne"
    causes: ["Disparition mystérieuse du Jarl précédent", "Rivalités tribales anciennes", "Contrôle du commerce de la glace"]
    manifestations: ["Désaccords au conseil tribal", "Blocus commerciaux internes", "Violences sporadiques"]
    mediation: "Ermites du Drann tentent une médiation spirituelle"
    intensite: "Élevée - Menace l'approvisionnement en glace noire"

  - nom: "Tension Énergétique Iskarienne"
    parties: ["Royaume Solaire du Zhaïr", "Territoires du Rift Shaar"]
    nature: "Conflit doctrinal et technologique"
    causes: ["Opposition entre énergie solaire et géothermale", "Rivalité sacerdotale", "Contrôle de la recherche"]
    manifestations: ["Sabotage de miroirs solaires", "Blocus de sites géothermaux", "Propagande active"]
