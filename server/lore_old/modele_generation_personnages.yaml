# modele_generation_personnages.yaml
modele: "systeme_generation_personnages_velkarum"
description: "Système complet de génération et vérification de personnages pour l'univers Velkarum"

# CONFIGURATION API ET MODÈLE
configuration_api:
  modele_linguistique: "hybride_semantique_velkarum"
  temperature_par_defaut: 0.7
  max_tokens_dialogue: 500
  max_tokens_verification: 300
  format_reponse: "structured_json"

# SYSTÈME DE GÉNÉRATION DE PERSONNAGES
generation_personnages:
  parametres_obligatoires:
    - "nom"
    - "origine_geographique"
    - "peuple"
    - "metier_statut"
    - "age_categorie"

  origines_geographiques:
    continents: ["Eldaron", "Varnäl", "Iskarion", "Thaurgrim", "Helrün"]
    regions_reference:
      Eldaron: ["Royaume Central de Valnoria", "Marches du Dalen", "Confédération Méridionale d'Ardel", "Principauté de Ferharn", "Ligues Côtières de Lirn", "Terres Tribales du Nord", "Marches Orientales", "Delta du Draen"]
      Varnäl: ["Forêts Primaires de Rhaal", "Bassins Marécageux de Marael", "Savanes de Cenra", "Massif Central de Velkar", "Côtes Océaniques de Tarran"]
      Iskarion: ["Royaume Solaire du Zhaïr", "Territoires du Rift Shaar", "Confédération des Plateaux de Surn", "Sultanat du Désert de Korra", "Ligue Maritimes d'Asuren"]
      Thaurgrim: ["Royaume Volcanique du Vulkar", "Plaines Fertiles du Drav", "Hauts Plateaux de Derna", "Côtes Géothermiques du Thun'ar", "Domaine Maritime d'Ashraal"]
      Helrün: ["Territoire des Clans du Nerr", "Domaine des Tribus du Nar", "Royaume Montagnard du Skarnheim", "Territoires des Nautes du Draen", "Sanctuaires des Ermites du Drann"]

  peuples_disponibles:
    principaux: ["Varnäliens", "Eldariens (Valnari)", "Helruniens", "Iskari", "Thaurgrims"]
    minoritaires: ["Nains Thaurgriens", "Elfes Sylvarin", "Centaures Talren", "Batraciens Grolka", "Nautes du Draen"]

  metiers_statuts:
    par_continent:
      Eldaron: ["noble", "marchand", "artisan", "soldat", "érudit", "paysan", "marin", "diplomate"]
      Varnäl: ["druide", "sylviculteur", "alchimiste", "chasseur", "guérisseur", "gardien_foret"]
      Iskarion: ["prêtre_solaire", "energeticien", "savant", "caravanier", "navigateur", "artisan_miroir"]
      Thaurgrim: ["forgemaster", "mineur", "ingénieur_geothermal", "commerçant_cendres", "gardien_volcan"]
      Helrün: ["chasseur_glace", "navigateur_polaire", "érudit_glaciologue", "commerçant_glace", "gardien_sanctuaire"]

  personnalites_base:
    traits_principaux: ["diplomate", "agressif", "curieux", "méfiant", "ambitieux", "loyal", "cynique", "idéaliste"]
    motivations: ["richesse", "pouvoir", "savoir", "survie", "foi", "famille", "honneur", "vengeance"]

# SYSTÈME DE VÉRIFICATION CROISÉE
verification_croisee:
  modules_verification:
    - "geographie"
    - "economie_commerce"
    - "culture_coutumes"
    - "geopolitique"
    - "histoire_mythes"

  regles_coherence:
    geographie:
      - "Vérifier concordance origine ↔ coordonnées"
      - "Vérifier distances voyages réalistes"
      - "Vérifier biomes cohérents avec descriptions"

    economie:
      - "Vérifier richesse réaliste selon métier/statut"
      - "Vérifier connaissances monnaies appropriées"
      - "Vérifier accès ressources crédible"

    culture:
      - "Vérifier comportements cohérents avec peuple"
      - "Vérifier connaissances religieuses appropriées"
      - "Vérifier relations inter-peuples crédibles"

    geopolitique:
      - "Vérifier allégeances politiques cohérentes"
      - "Vérifier connaissances conflits actuels"
      - "Vérifier relations inter-continentales"

# SYSTÈME DE PROMPTS ADAPTATIFS
generation_prompts:
  templates_dialogue:
    interrogation_standard: |
      "En tant que [personnage.nom], [personnage.metier] [personnage.peuple] originaire de [personnage.origine], répondez à la question suivante en tenant compte de votre personnalité, vos connaissances et votre contexte géopolitique: {question}"

    interrogation_contexte_specifique: |
      "Contexte: {contexte}. En tant que [personnage.nom], réagissez à cette situation selon votre caractère [personnage.personnalite] et vos motivations [personnage.motivation]: {situation}"

    conversation_naturelle: |
      "Dialogue naturel entre [personnage.nom] et un interlocuteur. Caractère: [personnage.personnalite]. Connaissances: [personnage.competences]. Répondez naturellement à: {dialogue}"

  templates_verification:
    coherence_geographique: |
      "Vérifier la cohérence géographique: Le personnage prétend venir de {lieu}. Selon les données Velkarum, ce lieu existe-t-il? Quelles sont ses caractéristiques? La distance avec {autre_lieu} est-elle crédible pour le voyage décrit?"

    coherence_economique: |
      "Vérifier la cohérence économique: Le personnage mentionne {transaction}. Les prix, monnaies et ressources mentionnés sont-ils cohérents avec l'économie de Velkarum? Son statut de {metier} permet-il ce type de transaction?"

    coherence_culturelle: |
      "Vérifier la cohérence culturelle: Le personnage {comportement} est-il crédible pour un {peuple} de {region}? Ses références aux cultes et traditions sont-elles exactes?"

# BASE DE CONNAISSANCES INTÉGRÉE
references_rapides:
  monnaies_principales: ["Couronne Eldarienne (♔)", "Pierre Solaire", "Sceau de Glace", "Masse de Cendre", "Souffle de Rhaal"]
  ressources_strategiques: ["Glace Noire", "Cendres Fertilisantes", "Bois de Rhaal", "Pierre Solaire", "Sel Fossile"]
  alliances_majeures: ["Conseil des Royaumes de Lorn", "Pacte du Triangle Énergétique", "Alliance du Feu et de la Glace", "Arc Nord Écologique"]
  conflits_actuels: ["Crise des Cendres Fertilisantes", "Tension Frontalière Orientale", "Conflit d'Influence en Mer d'Ashraal", "Crise de Succession Helrunienne"]
  cultes_principaux: ["Culte du Souffle", "Voiles d'Ygral", "Foi Solaire du Zhaïr", "Culte du Feu Profond", "Église des Quatre Saisons"]

# SYSTÈME DE SCORING DE CRÉDIBILITÉ
scoring_credibilite:
  criteres:
    - "exactitude_geographique"
    - "cohérence_culturelle"
    - "réalisme_economique"
    - "fidelite_historique"
    - "consistance_personnalite"

  niveaux:
    excellent: "90-100% - Parfaitement intégré dans l'univers"
    bon: "75-89% - Quelques approximations mineures"
    acceptable: "60-74% - Incohérences modérées nécessitant correction"
    faible: "40-59% - Incohérences majeures"
    inacceptable: "0-39% - Rupture complète avec l'univers"

# JOURNALISATION ET AMÉLIORATION
suivi_performances:
  metriques:
    - "temps_reponse_moyen"
    - "score_credibilite_moyen"
    - "verifications_automatiques_reussies"
    - "corrections_manuelles_necessaires"

  amelioration_continue:
    - "ajout_nouvelles_regions_decouvertes"
    - "mise_jour_conflits_evolution"
    - "integration_nouvelles_ressources"
    - "ajustement_economie_dynamique"

# EXEMPLES PRATIQUES
exemples_implementation:
  personnage_type: |
    nom: "Kaelen"
    peuple: "Varnälien"
    origine: "Forêts Primaires de Rhaal (35,75)"
    metier: "druide"
    age: "42 ans"
    personnalite: ["curieux", "idealiste", "méfiant envers la technologie"]
    motivation: "preservation_ecologique"
    connaissances: ["botanique avancée", "rites du Souffle", "navigation forestière"]
    limites: ["méconnaissance technologies volcaniques", "méfiance envers les Thaurgrims"]

  prompt_type: |
    "En tant que Kaelen, druide Varnälien originaire des Forêts Primaires de Rhaal, répondez à un marchand eldarien qui propose d'acheter du bois de Rhaal pour la construction navale. Votre personnalité curieuse mais méfiante et votre motivation de préservation écologique doivent guider votre réponse."

  verification_type: |
    "Vérifier: Un druide de Rhaal connaît-il les prix du bois? Est-il crédible qu'il négocie directement? Sa méfiance envers les Eldariens est-elle cohérente avec les tensions actuelles?"

# MÉTA-DONNÉES OPÉRATIONNELLES
meta_operationnel:
  date_creation: "2025-11-05"
  version: "1.0"
  statut: "actif"
  dependances: [
    "economie.yaml",
    "eldaron.yaml",
    "geopolitique.yaml",
    "helrun.yaml",
    "iskarion.yaml",
    "mythes_legendes.yaml",
    "thaurgrim.yaml",
    "us_coutumes_peuples.yaml",
    "varnal.yaml",
    "aspets_sombres.yaml"
  ]
  maintenance: "mise_a_jour_automatique_semaine"
  compatibilite: "api_velkarum_v2+"