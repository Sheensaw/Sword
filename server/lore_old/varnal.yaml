# DESCRIPTION NARRATIVE SYNTHÈSE COMPLÈTE ET COHÉRENTE
description_narrative: |
  Varnäl s'étend comme un poumon vivant, structuré en cinq régions écologiques
  aux fonctions planétaires complémentaires. Au nord-ouest, les Forêts Primaires 
  de Rhaal (35,75) dominent la production d'oxygène, connectées par la Voie du Souffle 
  (800 km) qui descend vers Marael (55,45) à 400 km au sud-est puis Velkar (45,20) 
  à 500 km au sud.

  Les Bassins Marécageux de Marael forment un arc de filtration au centre, où
  la Route des Marées (1200 km) relie Tarran (15,35) à Falaar (25,25) sur 200 km
  puis Marael sur 600 km supplémentaires. À l'est, les Savanes de Cenra rayonnent
  depuis Cenra (75,55), connectées par le Chemin des Graines (900 km) qui serpente
  vers les plaines de migration.

  Au sud, le Massif Central de Velkar commande la Piste des Brumes (600 km),
  route aérienne reliant Falaar aux condenseurs de brume puis à l'observatoire
  de Velkar. La Route Maritime du Fer-Bleu (2000 km) connecte Tarran aux côtes
  eldariennes via la confluence des courants.

  Chaque route a sa spécificité : la Voie du Souffle pour la spiritualité écologique,
  la Route des Marées pour le commerce côtier, le Chemin des Graines pour l'agriculture,
  la Piste des Brumes pour la recherche climatique, et la Route Maritime pour le
  commerce international.

  Cet équilibre entre régions forestières, marécageuses, agricoles, montagneuses
  et côtières fait de Varnäl le régulateur biologique de Velkarum, où chaque
  déplacement doit composer avec les cycles naturels et où les voyages entre
  régions prennent de 5 à 25 jours selon les saisons et les conditions atmosphériques.

